version: "3.9"

services:
  redpanda:
    image: redpandadata/redpanda:v23.2.8
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --node-id 0
      - --check=false
    ports:
      - "9092:9092"
      - "9644:9644"
  processor:
    image: crypto-processor:local
    container_name: local-processor
    restart: unless-stopped

    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      RAW_TOPIC: tx.raw
      ALERT_TOPIC: tx.alerts
      HIGH_VALUE_THRESHOLD_WEI: "1000000000000000000"

    depends_on:
      - redpanda

    ports:
      - "9000:9000"


  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: crypto
      POSTGRES_PASSWORD: crypto
      POSTGRES_DB: crypto_monitor
    ports:
      - "5432:5432"

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"

  ingestor:
    image: crypto-ingestor:local
    container_name: local-ingestor
    restart: unless-stopped

    environment:
      RPC_URL: ${RPC_URL}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: crypto_monitor
      DB_USER: crypto
      DB_PASSWORD: crypto

    depends_on:
      - redpanda
      - postgres

    ports:
      - "8000:8000"

